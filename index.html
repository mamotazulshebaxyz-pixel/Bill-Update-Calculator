<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Update & Target Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-6">
    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-3 flex items-center justify-between">
            <span>Bill Update Calculator</span>
            <span class="text-sm font-normal bg-blue-100 text-blue-800 px-3 py-1 rounded-full">v1.1</span>
        </h1>

        <!-- Target Amount Section -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <label class="block text-sm font-semibold text-blue-900">Target / Final Amount (টার্গেট অ্যামাউন্ট):</label>
                <p class="text-xs text-blue-700">আপনি যে মোট অ্যামাউন্টটি চাচ্ছেন তা এখানে ইনপুট দিতে পারেন বা নিচে হিসাব দেখতে পারেন।</p>
            </div>
            <input type="number" id="targetAmount" placeholder="Target Amount" class="w-full sm:w-48 px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 font-bold text-lg text-right" oninput="calculateAll()">
        </div>

        <!-- Services Section -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-700">Service Categories</h2>
                <button onclick="addServiceRow()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded shadow transition">+ Add Service</button>
            </div>
            <div id="serviceRowsContainer" class="space-y-3">
                <!-- Dynamic Service Rows will go here -->
            </div>
        </div>

        <!-- Material Section -->
        <div class="mb-6 bg-slate-50 p-4 rounded-lg border">
            <h2 class="text-lg font-semibold text-slate-700 mb-3">Materials Option</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Material Price (BDT)</label>
                    <input type="number" id="materialPrice" placeholder="0" class="w-full px-3 py-2 border rounded bg-white" oninput="calculateAll()">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Material VAT (1.43%)</label>
                    <input type="text" id="materialVatDisplay" readonly class="w-full px-3 py-2 border rounded bg-slate-100 text-slate-700 font-semibold" value="0.00">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Total Material with VAT</label>
                    <input type="text" id="materialTotalDisplay" readonly class="w-full px-3 py-2 border rounded bg-slate-100 text-slate-700 font-semibold" value="0.00">
                </div>
            </div>
        </div>

        <!-- Summary / Calculation Result Box -->
        <div class="bg-slate-800 text-white rounded-lg p-5">
            <h3 class="text-md font-semibold mb-3 border-b border-slate-700 pb-2">Calculation Summary</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                <div>
                    <span class="block text-slate-400 text-xs">Total Service Price (w/o VAT)</span>
                    <span id="sumServiceSubtotal" class="text-lg font-bold">0.00 Tk</span>
                </div>
                <div>
                    <span class="block text-slate-400 text-xs
